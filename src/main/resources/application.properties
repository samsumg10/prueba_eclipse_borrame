spring.application.name=ms-clientes
server.port:8081
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/db_clientes
spring.r2dbc.username=postgres
spring.r2dbc.password=123
spring.sql.init.mode=always

# --- Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# --- RabbitMQ ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Si el listener falla se reintenta 3 veces; luego el mensaje pasa a la cola .dlq
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

# --- Promoción a VIP: viajes finalizados que necesita un cliente ---
clientes.vip.viajes-requeridos=5
